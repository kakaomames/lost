name: Split Large Artifact

on:
  # 手動実行、または1つ目のワークフロー完了後に自動実行したい場合は workflow_run を設定します
  workflow_dispatch: 

permissions:       # 👈 これを追加
  contents: write  # 👈 これを追加

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    steps:
    
      # 👇 これを一番最初に追加！不要なツールを削除して約30GB以上の空きを作ります
      - name: Free Disk Space (Reclaim ~30GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: false
          large-packages: true
          swap-storage: true

         
      # 1. GitHub CLI を使って、特定の Run ID から17GBの成果物を直接ダウンロード
      # ※ ://github.com の成果物を取得します
            # 2. GitHub CLI を使って、特定の Run ID から17GBの成果物をダウンロード
      - name: Download Huge Artifact via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_extracted
          echo "Downloading artifact from run 35188198230..."
          echo ""
          gh --help
          echo ""
          # 修正箇所: artifact を削り、引数の順番を調整しました
          gh run download 35188198230 --name "Extracted-WAVs" --dir temp_extracted/


      # 2. 正しくダウンロード・展開されているかフォルダ構造を確認
      - name: Check Folder Structure
        run: |
          echo "=== Root Folder ==="
          ls -la temp_extracted/
          echo "=== Inside extracted_voice ==="
          # もし直下にない場合は、ここを実際のパスに合わせて確認してください
          ls -la temp_extracted/extracted_voice/ || ls -la temp_extracted/

      # 3. BGMフォルダだけを個別のZIPアーティファクトとしてアップロード (保管期間: 1日)
      - name: Upload BGM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-BGM
          path: temp_extracted/extracted_voice/BGM/
          retention-days: 1

      # 4. Voiceフォルダだけを個別のZIPアーティファクトとしてアップロード (保管期間: 1日)
      - name: Upload Voice Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-Voice
          path: temp_extracted/extracted_voice/Voice/
          retention-days: 1
