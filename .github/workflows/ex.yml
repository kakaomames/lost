name: Split Large Artifact

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    steps:
    
      # 1. 2分間かけて安全に30GB以上の空き容量を確保
      # (17GBのダウンロード・解凍・再圧縮に耐えるディスクを作ります)
      - name: Free Disk Space (Reclaim ~30GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: false
          large-packages: true
          swap-storage: true

      # 2. GitHub CLI でリポジトリを明示して17GBの成果物を確実にダウンロード
      - name: Download Huge Artifact via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_extracted
          echo "Downloading artifact from run 35188198230..."
          
          # 修正ポイント: -R でリポジトリを明示し、引数の位置を修正しました
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MY_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com/kakaomames/lost/actions/runs/35188198230/artifacts/10485906213 \
            -o artifact.zip
          curl -L "https://github.com/kakaomames/lost/actions/runs/35188198230/artifacts/10485906213" -o temp_extracted/

      # 3. フォルダ構造の確認
      - name: Check Folder Structure
        run: |
          echo "=== Root Folder ==="
          ls -la temp_extracted/
          echo "=== Inside extracted_voice ==="
          ls -la temp_extracted/extracted_voice/ || ls -la temp_extracted/

      # 4. BGMフォルダだけを個別のアーティファクトとしてアップロード
      - name: Upload BGM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-BGM
          path: temp_extracted/extracted_voice/BGM/
          retention-days: 1

      # 5. Voiceフォルダだけを個別のアーティファクトとしてアップロード
      - name: Upload Voice Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-Voice
          path: temp_extracted/extracted_voice/Voice/
          retention-days: 1
