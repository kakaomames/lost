name: Split Large Artifact

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    steps:
    
      # 1. 2分間かけて安全に30GB以上の空き容量を確保
      # (17GBのダウンロード・解凍・再圧縮に耐えるディスクを作ります)
      - name: Free Disk Space (Reclaim ~30GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: false
          large-packages: true
          swap-storage: true


      # 2. URLを分解して結合し、安全にcurlでダウンロードして解凍
           # 2. URLを分解・結合し、リダイレクト対策をして安全にcurlでダウンロードして解凍
      - name: Download Huge Artifact via curl
        env:
          MY_TOKEN: ${{ secrets.MY_DOWNLOAD_TOKEN }}
        run: |
          mkdir -p temp_extracted
          echo "Processing download request..."

          API_HOST="api"
          DOMAIN="github.com"
          REPO_PATH="repos/kakaomames/lost"
          TARGET_TYPE="actions/artifacts"
          ART_ID="10485906213"
          FILE_EXT="zip"

          FULL_API_URL="https://${API_HOST}.${DOMAIN}/${REPO_PATH}/${TARGET_TYPE}/${ART_ID}/${FILE_EXT}"

          echo "Fetching data..."
          
          # 修正ポイント: 
          # 1. 最初のアクセスでダウンロード用の「実際のURL(S3など)」を取得する
          # 2. そのURLに対して、GitHubのトークンを持たせずに直接ダウンロードをかける
          DOWNLOAD_URL=$(curl -s -I \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MY_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$FULL_API_URL" | grep -i '^location:' | awk '{print $2}' | tr -d '\r')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Failed to get download URL from GitHub API."
            exit 1
          fi

          echo "Downloading 17GB file from secure storage..."
          # トークンを一切含めず、純粋にファイルだけを落とす
          curl -L "$DOWNLOAD_URL" -o artifact.zip

          echo "Unzipping 17GB artifact..."
          unzip -q artifact.zip -d temp_extracted/
          
          rm artifact.zip


      # 3. フォルダ構造の確認
      - name: Check Folder Structure
        run: |
          echo "=== Root Folder ==="
          ls -la temp_extracted/
          echo "=== Inside extracted_voice ==="
          ls -la temp_extracted/extracted_voice/ || ls -la temp_extracted/

      # 4. BGMフォルダだけを個別のアーティファクトとしてアップロード
      - name: Upload BGM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-BGM
          path: temp_extracted/extracted_voice/BGM/
          retention-days: 1

      # 5. Voiceフォルダだけを個別のアーティファクトとしてアップロード
      - name: Upload Voice Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-Voice
          path: temp_extracted/extracted_voice/Voice/
          retention-days: 1
